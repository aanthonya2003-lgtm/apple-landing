<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%231d1d1f'%3E%3Cpath d='M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.24 2.31-.93 3.57-.84 1.51.12 2.65.72 3.4 1.8-3.12 1.87-2.38 5.98.48 7.13-.57 1.5-1.31 2.99-2.54 4.09l.01-.01zM12 7.25c-.15-2.23 1.66-4.07 3.74-4.25.29 2.58-2.34 4.5-3.74 4.25z'/%3E%3C/svg%3E"
      type="image/svg+xml"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#FBFBFD" />
    <meta
      name="description"
      content="iPhone 16 Pro. Built for Apple Intelligence. Designed in California, made for everywhere."
    />
    <meta property="og:title" content="Apple — iPhone 16 Pro" />
    <meta property="og:description" content="iPhone 16 Pro. Hello, Apple Intelligence." />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="en_US" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Async-load Inter so it never render-blocks. -apple-system in
         the font stack renders SF Pro instantly on Apple devices;
         Inter swaps in non-blocking on other devices when ready. -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet"
      />
    </noscript>
    <link rel="preconnect" href="https://www.apple.com" />
    <!-- Preload the iPhone hero image so the fetch begins before the React
         bundle parses. imagesrcset descriptors are the source's REAL widths
         (416/576/653 — these are the actual JPEG dimensions Apple serves).
         imagesizes mirrors the <img>'s sizes so the preload selects the
         same variant the browser picks at runtime. -->
    <link
      rel="preload"
      as="image"
      href="https://www.apple.com/newsroom/images/2024/09/apple-debuts-iphone-16-pro-and-iphone-16-pro-max/article/Apple-iPhone-16-Pro-hero-240909_inline.jpg.medium.jpg"
      imagesrcset="https://www.apple.com/newsroom/images/2024/09/apple-debuts-iphone-16-pro-and-iphone-16-pro-max/article/Apple-iPhone-16-Pro-hero-240909_inline.jpg.small.jpg 416w, https://www.apple.com/newsroom/images/2024/09/apple-debuts-iphone-16-pro-and-iphone-16-pro-max/article/Apple-iPhone-16-Pro-hero-240909_inline.jpg.medium.jpg 576w, https://www.apple.com/newsroom/images/2024/09/apple-debuts-iphone-16-pro-and-iphone-16-pro-max/article/Apple-iPhone-16-Pro-hero-240909_inline.jpg.large.jpg 653w"
      imagesizes="(max-width: 768px) 100vw, 820px"
      fetchpriority="high"
    />
    <title>iPhone 16 Pro — Apple</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
